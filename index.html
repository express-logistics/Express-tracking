<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Express Logistics Tracking</title>

<style>
body {
font-family: Arial, sans-serif;
background: #f4f4f4;
text-align: center;
padding: 60px;
}

.container {
background: white;
padding: 40px;
border-radius: 12px;
box-shadow: 0px 0px 20px rgba(0,0,0,0.1);
max-width: 800px;
margin: auto;
}

h1 {
margin-bottom: 5px;
}

h3 {
color: #666;
margin-bottom: 30px;
}

input {
padding: 12px;
width: 70%;
border-radius: 6px;
border: 1px solid #ccc;
}

button {
margin-top: 15px;
padding: 12px 25px;
background-color: #ffcc00;
border: none;
border-radius: 6px;
cursor: pointer;
font-weight: bold;
}

button:hover {
background-color: #e6b800;
}

.result {
margin-top: 25px;
text-align: left;
line-height: 1.7;
font-weight: bold;
}

.progress {
margin-top: 25px;
}

.step {
padding: 10px;
margin: 6px 0;
background: #eee;
border-radius: 5px;
}

.active {
background: #ffcc00;
}

iframe {
margin-top: 20px;
border-radius: 10px;
border: none;
}
</style>
</head>

<body>

<div class="container">
<h1>Express Logistics</h1>
<h3>International Shipment Tracking</h3>

<input type="text" id="trackingInput" placeholder="Enter Tracking Number">
<br>
<button onclick="trackShipment()">Track Shipment</button>

<div class="result" id="result"></div>
<div class="progress" id="progress"></div>

<iframe id="mapFrame" width="100%" height="300"></iframe>

</div>

<script>

const shipments = {
"EXP-2026-001": {
status: "In Transit",
origin: "New York, USA",
destination: "Canada",
location: "Buffalo, NY",
eta: "24 - 48 Hours"
},
"EXP-2026-002": {
status: "Arrived at Border",
origin: "New York, USA",
destination: "Canada",
location: "Niagara Border Crossing",
eta: "12 - 24 Hours"
},
"EXP-2026-003": {
status: "Out for Delivery",
origin: "New York, USA",
destination: "Toronto, Canada",
location: "Toronto Distribution Center",
eta: "Today"
}
};

function trackShipment() {

const trackingNumber = document.getElementById("trackingInput").value.trim().toUpperCase();
const result = document.getElementById("result");
const progress = document.getElementById("progress");
const mapFrame = document.getElementById("mapFrame");

if (!shipments[trackingNumber]) {
result.innerHTML = "<span style='color:red;'>Tracking number not found.</span>";
progress.innerHTML = "";
mapFrame.src = "";
return;
}

const shipment = shipments[trackingNumber];

result.innerHTML =
"Tracking Number: " + trackingNumber + "<br>" +
"Status: " + shipment.status + "<br>" +
"Origin: " + shipment.origin + "<br>" +
"Destination: " + shipment.destination + "<br>" +
"Current Location: " + shipment.location + "<br>" +
"Estimated Delivery: " + shipment.eta;

generateProgress(shipment.status);

mapFrame.src =
"https://www.google.com/maps?q=" + shipment.location + "&output=embed";
}

function generateProgress(status) {

const steps = [
"Order Confirmed",
"Dispatched",
"In Transit",
"Arrived at Border",
"Out for Delivery",
"Delivered"
];

const progress = document.getElementById("progress");
progress.innerHTML = "<h3>Shipment Progress</h3>";

steps.forEach(step => {
const div = document.createElement("div");
div.className = "step";
div.innerText = step;

if (status.toLowerCase().includes(step.toLowerCase())) {
div.classList.add("active");
}

progress.appendChild(div);
});

}

</script>

</body>
</html>
