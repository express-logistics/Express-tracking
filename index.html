<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Express Logistics</title>

<style>
body {
font-family: Arial, sans-serif;
background: #111;
color: white;
text-align: center;
padding: 40px;
}

.container {
background: #1c1c1c;
padding: 40px;
border-radius: 12px;
max-width: 900px;
margin: auto;
box-shadow: 0px 0px 30px rgba(0,0,0,0.5);
}

h1 {
color: #ffcc00;
}

input, select {
padding: 10px;
width: 70%;
margin-top: 10px;
border-radius: 6px;
border: none;
}

button {
padding: 12px 25px;
background-color: #ffcc00;
border: none;
border-radius: 6px;
cursor: pointer;
font-weight: bold;
margin-top: 15px;
}

button:hover {
background-color: #e6b800;
}

.result {
margin-top: 25px;
text-align: left;
line-height: 1.7;
}

.progress {
margin-top: 25px;
}

.step {
padding: 10px;
margin: 6px 0;
background: #333;
border-radius: 5px;
}

.active {
background: #ffcc00;
color: black;
}

.admin-panel {
margin-top: 50px;
padding: 20px;
background: #222;
border-radius: 10px;
}

iframe {
margin-top: 20px;
border-radius: 10px;
border: none;
}
</style>
</head>

<body>

<div class="container">
<h1>Express Logistics</h1>
<h3>Premium International Shipment Tracking</h3>

<input type="text" id="trackingInput" placeholder="Enter Tracking Number">
<br>
<button onclick="trackShipment()">Track Shipment</button>

<div class="result" id="result"></div>
<div class="progress" id="progress"></div>

<iframe id="mapFrame" width="100%" height="300"></iframe>

<div class="admin-panel">
<h2>Admin Panel</h2>

<input type="password" id="adminPass" placeholder="Enter Admin Password">
<br>
<button onclick="unlockAdmin()">Unlock</button>

<div id="adminControls" style="display:none; margin-top:20px;">

<input type="text" id="origin" placeholder="Origin (e.g. New York, USA)">
<input type="text" id="destination" placeholder="Destination (e.g. Canada)">
<input type="text" id="location" placeholder="Current Location">
<select id="status">
<option>Order Confirmed</option>
<option>Dispatched</option>
<option>In Transit</option>
<option>Arrived at Border</option>
<option>Out for Delivery</option>
<option>Delivered</option>
</select>
<input type="text" id="eta" placeholder="Estimated Delivery">

<br>
<button onclick="generateTracking()">Generate Tracking Number</button>

<p id="generatedNumber"></p>

</div>
</div>

</div>

<script>

let shipments = {
"EXP-2026-001": {
status: "In Transit",
origin: "New York, USA",
destination: "Canada",
location: "Buffalo, NY",
eta: "24 - 48 Hours"
}
};

function trackShipment() {

const trackingNumber = document.getElementById("trackingInput").value.trim().toUpperCase();
const result = document.getElementById("result");
const progress = document.getElementById("progress");
const mapFrame = document.getElementById("mapFrame");

if (!shipments[trackingNumber]) {
result.innerHTML = "<span style='color:red;'>Tracking number not found.</span>";
progress.innerHTML = "";
mapFrame.src = "";
return;
}

const shipment = shipments[trackingNumber];

result.innerHTML =
"<strong>Tracking:</strong> " + trackingNumber + "<br>" +
"<strong>Status:</strong> " + shipment.status + "<br>" +
"<strong>Origin:</strong> " + shipment.origin + "<br>" +
"<strong>Destination:</strong> " + shipment.destination + "<br>" +
"<strong>Current Location:</strong> " + shipment.location + "<br>" +
"<strong>ETA:</strong> " + shipment.eta;

generateProgress(shipment.status);

mapFrame.src =
"https://www.google.com/maps?q=" + shipment.location + "&output=embed";
}

function generateProgress(status) {

const steps = [
"Order Confirmed",
"Dispatched",
"In Transit",
"Arrived at Border",
"Out for Delivery",
"Delivered"
];

const progress = document.getElementById("progress");
progress.innerHTML = "<h3>Shipment Progress</h3>";

steps.forEach(step => {
const div = document.createElement("div");
div.className = "step";
div.innerText = step;

if (status === step) {
div.classList.add("active");
}

progress.appendChild(div);
});
}

function unlockAdmin() {
const pass = document.getElementById("adminPass").value;
if (pass === "admin123") {
document.getElementById("adminControls").style.display = "block";
} else {
alert("Incorrect Password");
}
}

function generateTracking() {

const newNumber = "EXP-" + new Date().getFullYear() + "-" + Math.floor(100 + Math.random() * 900);

shipments[newNumber] = {
origin: document.getElementById("origin").value,
destination: document.getElementById("destination").value,
location: document.getElementById("location").value,
status: document.getElementById("status").value,
eta: document.getElementById("eta").value
};

document.getElementById("generatedNumber").innerHTML =
"New Tracking Number: <strong>" + newNumber + "</strong>";

}

</script>
