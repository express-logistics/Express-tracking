<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Express Logistics Tracking</title>

<style>
body {
font-family: Arial, sans-serif;
background-color: #f4f4f4;
text-align: center;
padding: 60px;
}

.container {
background: white;
padding: 40px;
border-radius: 12px;
box-shadow: 0px 0px 20px rgba(0,0,0,0.1);
max-width: 600px;
margin: auto;
}

h1 {
margin-bottom: 5px;
}

h3 {
color: #666;
margin-bottom: 30px;
}

input {
padding: 12px;
width: 80%;
border-radius: 6px;
border: 1px solid #ccc;
font-size: 14px;
}

button {
margin-top: 15px;
padding: 12px 25px;
background-color: #ffcc00;
border: none;
border-radius: 6px;
cursor: pointer;
font-weight: bold;
}

button:hover {
background-color: #e6b800;
}

.result {
margin-top: 30px;
text-align: left;
font-weight: bold;
line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">
<h1>Express Logistics</h1>
<h3>International Shipment Tracking</h3>

<input type="text" id="trackingInput" placeholder="Enter Tracking Number">
<br>
<button id="trackBtn">Track Shipment</button>

<div class="result" id="result"></div>
</div>

<script>
document.getElementById("trackBtn").addEventListener("click", function() {

var trackingNumber = document.getElementById("trackingInput").value.trim().toUpperCase();
var result = document.getElementById("result");

if (trackingNumber === "EXP-2026-001") {
result.innerHTML =
"Tracking Number: EXP-2026-001 <br>" +
"Status: In Transit <br>" +
"Origin: New York, USA <br>" +
"Destination: Canada <br>" +
"Current Location: Buffalo, NY <br>" +
"Estimated Delivery: 24 - 48 Hours";
}
else if (trackingNumber === "EXP-2026-002") {
result.innerHTML =
"Tracking Number: EXP-2026-002 <br>" +
"Status: Arrived at Border Facility <br>" +
"Origin: New York, USA <br>" +
"Destination: Canada <br>" +
"Current Location: Niagara Border Crossing <br>" +
"Estimated Delivery: 12 - 24 Hours";
}
else {
result.innerHTML = "<span style='color:red;'>Tracking number not found.</span>";
}

});
</script>

</body>
</html>
